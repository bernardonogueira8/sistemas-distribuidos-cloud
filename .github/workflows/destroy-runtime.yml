name: Destroy API Runtime
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DESTROY API RUNTIME to remove MIGs, Load Balancer and DNS
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: application-gcp-state
  cancel-in-progress: false
jobs:
  destroy-runtime:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DESTROY API RUNTIME'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ vars.GCP_GITHUB_ENVIRONMENT || 'prod' }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      BACKEND_HCL: ${{ vars.GCP_BACKEND_HCL }}
      TFVARS: ${{ vars.GCP_TFVARS }}
    steps:
      - name: Prepare private runner files
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/gcp-destroy"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: deployer
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
          cleanup_credentials: true
      - name: Keep deployer credentials outside checkout
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/gcp-destroy/deployer-credentials.json"
          mv "$GOOGLE_GHA_CREDS_PATH" "$destination"
          chmod 600 "$destination"
          for variable in GOOGLE_GHA_CREDS_PATH GOOGLE_APPLICATION_CREDENTIALS CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE; do
            printf '%s=%s\n' "$variable" "$destination" >> "$GITHUB_ENV"
          done
      - name: Initialize application state
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            test -n "$BACKEND_HCL"
            test -n "$TFVARS"
            printf '%s\n' "$BACKEND_HCL" > infra/backend.hcl
            printf '%s\n' "$TFVARS" > infra/terraform.tfvars
            terraform -chdir=infra init -input=false -lockfile=readonly -backend-config=backend.hcl
          } > "$RUNNER_TEMP/gcp-destroy/init.log" 2>&1
      - name: Verify the production runtime target
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
            grep -Fxq 'bucket = "sistemas-distribuidos-cloud"' infra/backend.hcl
            grep -Fxq 'prefix = "application/single"' infra/backend.hcl
            deployment=$(terraform -chdir=infra output -json deployment)
            jq -e '.project_id == "dev-performance-359512" and .name == "distributed-cloud" and .enable_runtime == true' <<< "$deployment" >/dev/null
            printf 'enable_runtime = false\nimage = ""\n' > infra/release.auto.tfvars
          } > "$RUNNER_TEMP/gcp-destroy/preflight.log" 2>&1 || {
            printf 'Runtime destroy preflight failed. State target mismatch or runtime is already disabled.\n' >&2
            exit 1
          }
      - name: Plan runtime removal
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          terraform -chdir=infra plan -input=false -no-color -lock-timeout=5m -out="$RUNNER_TEMP/gcp-destroy/runtime.tfplan" > "$RUNNER_TEMP/gcp-destroy/plan.stdout.log" 2> "$RUNNER_TEMP/gcp-destroy/plan.stderr.log" || {
            printf 'Runtime destroy plan failed.\n' >&2
            exit 1
          }
      - name: Apply exact runtime removal plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          terraform -chdir=infra apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/gcp-destroy/runtime.tfplan" > "$RUNNER_TEMP/gcp-destroy/apply.stdout.log" 2> "$RUNNER_TEMP/gcp-destroy/apply.stderr.log" || {
            printf 'Runtime destroy apply failed.\n' >&2
            exit 1
          }
          printf 'Removed the regional API runtime, global Load Balancer and application DNS record. SQL, uploaded objects, registry, VPC and bootstrap are retained.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private deployment files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/gcp-destroy" infra/.terraform
          rm -f -- infra/backend.hcl infra/terraform.tfvars infra/release.auto.tfvars
          rm -f -- infra/errored.tfstate infra/crash.log infra/crash.*.log
          if [[ -n "$ORIGINAL_CREDENTIALS" ]]; then rm -f -- "$ORIGINAL_CREDENTIALS"; fi
        env:
          ORIGINAL_CREDENTIALS: ${{ steps.deployer.outputs.credentials_file_path }}
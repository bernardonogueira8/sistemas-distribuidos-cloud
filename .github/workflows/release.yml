name: Publish And Deploy API
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY TO PROD to authorize build, schema, plan and apply
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: application-gcp-state
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY TO PROD'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ vars.GCP_GITHUB_ENVIRONMENT || 'prod' }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      BACKEND_HCL: ${{ vars.GCP_BACKEND_HCL }}
      TFVARS: ${{ vars.GCP_TFVARS }}
    steps:
      - name: Prepare private runner files
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/gcp-deployment"
          printf 'DOCKER_CONFIG=%s/docker\nCLOUDSDK_CONFIG=%s/gcloud\n' "$RUNNER_TEMP/gcp-deployment" "$RUNNER_TEMP/gcp-deployment" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.11.4'
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: deployer
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}
          cleanup_credentials: true
      - name: Keep deployer credentials outside the Docker build context
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/gcp-deployment/deployer-credentials.json"
          mv "$GOOGLE_GHA_CREDS_PATH" "$destination"
          chmod 600 "$destination"
          for variable in GOOGLE_GHA_CREDS_PATH GOOGLE_APPLICATION_CREDENTIALS CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE; do
            printf '%s=%s\n' "$variable" "$destination" >> "$GITHUB_ENV"
          done
      - uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a
      - name: Initialize the application infrastructure
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
          test -n "$BACKEND_HCL"
          test -n "$TFVARS"
          printf '%s\n' "$BACKEND_HCL" > infra/backend.hcl
          printf '%s\n' "$TFVARS" > infra/terraform.tfvars
          terraform -chdir=infra init -input=false -lockfile=readonly -backend-config=backend.hcl
          } > "$RUNNER_TEMP/gcp-deployment/init.log" 2>&1
      - name: Plan infrastructure with the current runtime
        id: base-plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          write_runtime_inputs() {
            local outputs current enabled image resources
            outputs=$(terraform -chdir=infra output -json) || return 1
            current=$(jq -c '.deployment.value // null' <<< "$outputs") || return 1
            if [[ "$current" == null ]]; then
              resources=$(terraform -chdir=infra state list) || return 1
              [[ -z "$resources" ]] || return 1
              printf 'enable_runtime = false\nimage = ""\n' > infra/release.auto.tfvars || return 1
              return 0
            fi
            enabled=$(jq -er '.enable_runtime | select(type == "boolean") | tostring' <<< "$current") || return 1
            if [[ "$enabled" == true ]]; then
              image=$(jq -er '.image | select(type == "string" and test("^[a-z0-9-]+-docker\\.pkg\\.dev/[a-z0-9-]+/[a-z0-9_-]+/api@sha256:[a-f0-9]{64}$"))' <<< "$current") || return 1
            else
              resources=$(terraform -chdir=infra state list) || return 1
              if [[ "$resources" == *'module.compute['* || "$resources" == *'module.compute_secondary['* || "$resources" == *'module.load_balancer['* ]]; then
                image=$(terraform -chdir=infra state pull | jq -er '
                  [.resources[] | select((.module == "module.compute[0]" or .module == "module.compute_secondary[0]") and .type == "google_compute_instance_template") |
                    .instances[].attributes.metadata["startup-script"] |
                    capture("(?:^|\\n)IMAGE=\u0027(?<image>[a-z0-9-]+-docker\\.pkg\\.dev/[a-z0-9-]+/[a-z0-9_-]+/api@sha256:[a-f0-9]{64})\u0027(?:\\n|$)").image] |
                  unique | select(length == 1) | .[0]
                ') || return 1
                enabled=true
              else
                image=""
              fi
            fi
            printf 'enable_runtime = %s\nimage = "%s"\n' "$enabled" "$image" > infra/release.auto.tfvars || return 1
          }
          if ! write_runtime_inputs > "$RUNNER_TEMP/gcp-deployment/base-inputs.log" 2>&1; then
            printf 'Infrastructure preflight failed. Cannot safely preserve the current runtime from state.\n' >&2
            exit 1
          fi
          if ! terraform -chdir=infra plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/gcp-deployment/base.tfplan" > "$RUNNER_TEMP/gcp-deployment/base-plan.stdout.log" 2> "$RUNNER_TEMP/gcp-deployment/base-plan.stderr.log"; then
            diagnostic=$(awk '
              /^Error: / {
                sub(/^Error: /, "")
                gsub(/"[^"]*"/, "\"[redacted]\"")
                gsub(/[[:alnum:]_.+-]+@[[:alnum:].-]+/, "[redacted identity]")
                gsub(/sha256:[[:xdigit:]]+/, "sha256:[redacted]")
                gsub(/https?:\/\/[^ ]+/, "[redacted URL]")
                print substr($0, 1, 240)
                exit
              }
            ' "$RUNNER_TEMP/gcp-deployment/base-plan.stderr.log")
            location=$(awk '/^  on / { sub(/^  /, ""); print; exit }' "$RUNNER_TEMP/gcp-deployment/base-plan.stderr.log")
            printf 'Infrastructure plan failed.\n' >&2
            if [[ -n "$diagnostic" ]]; then printf 'Terraform diagnostic: %s\n' "$diagnostic" >&2; fi
            if [[ -n "$location" ]]; then printf 'Terraform location: %s\n' "$location" >&2; fi
            if grep -Eiq '403|permission denied|not authorized|unauthorized' "$RUNNER_TEMP/gcp-deployment/base-plan.stderr.log"; then
              printf 'Terraform error category: GCP API authorization or permission failure.\n' >&2
            fi
            exit 1
          fi
      - name: Apply the exact infrastructure plan before publishing
        id: base-apply
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          terraform -chdir=infra apply -input=false -lock-timeout=5m "$RUNNER_TEMP/gcp-deployment/base.tfplan" > "$RUNNER_TEMP/gcp-deployment/base-apply.stdout.log" 2> "$RUNNER_TEMP/gcp-deployment/base-apply.stderr.log" || { printf 'Infrastructure apply failed.\n' >&2; exit 1; }
      - name: Read the updated infrastructure outputs
        id: deployment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
          deployment=$(terraform -chdir=infra output -json deployment)
          jq -e '(.image_repository | type == "string" and length > 0) and (.registry_host | type == "string" and length > 0) and (.db_connection_name | type == "string" and length > 0) and (.runtime_secret_id | type == "string" and length > 0)' <<< "$deployment" >/dev/null
          printf 'repository=%s\nhost=%s\n' "$(jq -r '.image_repository' <<< "$deployment")" "$(jq -r '.registry_host' <<< "$deployment")" >> "$GITHUB_OUTPUT"
          } > "$RUNNER_TEMP/gcp-deployment/outputs.log" 2>&1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: publisher
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT || vars.GCP_RELEASE_PLAN_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish Linux amd64 image with provenance and SBOM
        id: image
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
          printf '%s' "$ACCESS_TOKEN" | docker login --username oauth2accesstoken --password-stdin "$REGISTRY_HOST"
          docker buildx create --use
          docker buildx build --platform linux/amd64 --push --provenance=mode=max --sbom=true \
            --tag "$REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --metadata-file "$RUNNER_TEMP/gcp-deployment/build.json" --file apps/api/Dockerfile .
          digest=$(jq -er '.["containerimage.digest"] | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/gcp-deployment/build.json")
          printf 'image=%s@%s\n' "$REPOSITORY" "$digest" >> "$GITHUB_OUTPUT"
          } > "$RUNNER_TEMP/gcp-deployment/build.log" 2>&1
        env:
          ACCESS_TOKEN: ${{ steps.publisher.outputs.access_token }}
          REPOSITORY: ${{ steps.deployment.outputs.repository }}
          REGISTRY_HOST: ${{ steps.deployment.outputs.host }}
      - name: Apply schema before planning the image update
        run: |
          umask 077
          if ! bash scripts/apply-schema-gcp.sh "$IMAGE" > "$RUNNER_TEMP/gcp-deployment/schema.log" 2>&1; then
            failure_reason=$(sed -nE 's/^Schema failure reason: (proxy-credentials|proxy-authentication|cloud-sql-permission|cloud-sql-connectivity|image-pull|database-authentication|database-permission|schema-syntax|connection-refused|connection-reset|connection-timeout|proxy-dns|unclassified)\.$/\1/p' "$RUNNER_TEMP/gcp-deployment/schema.log" | head -n 1)
            if [[ -n "$failure_reason" ]]; then printf 'Schema failure reason: %s.\n' "$failure_reason" >&2; fi
            failure_stage=$(sed -nE 's/^Schema operation failed during (prerequisites|deployment-output|image-validation|workspace|credentials|secret-fetch|proxy-start|schema-apply|cleanup)\.$/\1/p' "$RUNNER_TEMP/gcp-deployment/schema.log" | head -n 1)
            if [[ -n "$failure_stage" ]]; then
              printf 'Schema operation failed during %s.\n' "$failure_stage" >&2
            else
              printf 'Schema operation failed.\n' >&2
            fi
            exit 1
          fi
        env:
          IMAGE: ${{ steps.image.outputs.image }}
      - name: Persist release inputs and save the deployment plan
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'enable_runtime = true\nimage = "%s"\n' "$IMAGE" > infra/release.auto.tfvars
          terraform -chdir=infra plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/gcp-deployment/deployment.tfplan" > "$RUNNER_TEMP/gcp-deployment/plan.stdout.log" 2> "$RUNNER_TEMP/gcp-deployment/plan.stderr.log" || { printf 'Terraform plan failed.\n' >&2; exit 1; }
        env:
          IMAGE: ${{ steps.image.outputs.image }}
      - name: Apply the exact plan in this runner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          terraform -chdir=infra apply -input=false -lock-timeout=5m "$RUNNER_TEMP/gcp-deployment/deployment.tfplan" > "$RUNNER_TEMP/gcp-deployment/apply.stdout.log" 2> "$RUNNER_TEMP/gcp-deployment/apply.stderr.log" || { printf 'Terraform apply failed.\n' >&2; exit 1; }
      - name: Wait for the MIG and HTTP endpoint, then smoke test
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          {
          deployment=$(terraform -chdir=infra output -json deployment)
          node scripts/check-runtime-gcp.js
          url=$(jq -er '.api_url' <<< "$deployment")
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 10 --max-time 10 "$url" >/dev/null
          SMOKE_ALLOW_HTTP=true node tests/smoke/api.js "$url"
          } > "$RUNNER_TEMP/gcp-deployment/health.log" 2>&1
      - name: Record the immutable release
        run: printf 'Deployed image `%s`. Synchronize local terraform.tfvars and GCP_TFVARS with this digest and enable_runtime=true.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE: ${{ steps.image.outputs.image }}
      - name: Remove private deployment files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$RUNNER_TEMP/gcp-deployment" infra/.terraform
          rm -f -- infra/backend.hcl infra/terraform.tfvars infra/release.auto.tfvars
          rm -f -- infra/errored.tfstate infra/crash.log infra/crash.*.log
          if [[ -n "$ORIGINAL_CREDENTIALS" ]]; then rm -f -- "$ORIGINAL_CREDENTIALS"; fi
        env:
          ORIGINAL_CREDENTIALS: ${{ steps.deployer.outputs.credentials_file_path }}